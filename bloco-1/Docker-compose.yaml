services:
  postgres:
    image: postgres:14.24-alpine3.23
    environment:
      POSTGRES_PASSWORD: 'psqlpass'
      POSTGRES_USER: psqluser
      POSTGRES_DB: ecommerce_db
    ports:
      - 5432:5432
    volumes:
      - postgresapi:/var/lib/postgresql/data
  api-fastapi:
    image: api-fastapi:v1
    environment:
      DATABASE_URL: $DBURL
    ports:
      - 8000:8000
volumes:
  postgresapi:
